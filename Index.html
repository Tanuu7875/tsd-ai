<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02060f">
  <title>TSD AI</title>

  <style>
    /* ============================================================
       1. COLORS AND BASIC SETUP
       ============================================================ */
    :root {
      --bg: #02060f;            /* very dark blue background */
      --blue: #19c3ff;          /* main glowing blue */
      --blue-soft: #0a5f85;     /* softer blue for borders */
      --text: #d8f3ff;          /* light text */
      --user-bg: #0b3a52;       /* user message bubble */
      --ai-bg: #08182a;         /* assistant message bubble */
      --warn: #ffb347;          /* orange for the "not connected" notice */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #06182c 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    }

    /* The whole app is one tall column: header, circle, chat, buttons, input */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    }

    /* ============================================================
       2. HEADER (title + language selector)
       ============================================================ */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: var(--blue);
      text-shadow: 0 0 10px var(--blue);
    }
    select {
      background: #06182c;
      color: var(--text);
      border: 1px solid var(--blue-soft);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.95rem;
    }

    /* ============================================================
       3. NOTICE: AI chat + automation not connected yet
       ============================================================ */
    .notice {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--warn);
      border-radius: 8px;
      color: var(--warn);
      font-size: 0.78rem;
      line-height: 1.35;
      background: rgba(255, 179, 71, 0.07);
    }

    /* ============================================================
       4. THE GLOWING JARVIS CIRCLE
       ============================================================ */
    #orb-wrap {
      display: flex;
      justify-content: center;
      padding: 12px 0 6px;
    }
    #orb {
      position: relative;
      width: 130px;
      height: 130px;
    }
    /* Each ring is a circle border that spins */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .ring.r1 {
      inset: 0;
      border-top-color: var(--blue);
      border-bottom-color: var(--blue);
      box-shadow: 0 0 14px var(--blue);
      animation: spin 4s linear infinite;
    }
    .ring.r2 {
      inset: 12px;
      border: 2px dashed var(--blue-soft);
      animation: spin 9s linear infinite reverse;
    }
    .ring.r3 {
      inset: 24px;
      border-left-color: var(--blue);
      border-right-color: var(--blue);
      animation: spin 2.5s linear infinite;
    }
    /* The bright center of the circle */
    .core {
      position: absolute;
      inset: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #bdf0ff 0%, var(--blue) 45%, #0a5f85 100%);
      box-shadow: 0 0 25px var(--blue), 0 0 60px rgba(25, 195, 255, 0.5);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    /* When listening or speaking, the circle gets faster and brighter */
    body.listening .core  { animation-duration: 0.7s; }
    body.listening .ring.r1 { animation-duration: 1.2s; }
    body.speaking  .core  { animation-duration: 0.9s; background: radial-gradient(circle, #fff 0%, #5fe0ff 45%, #0a8fc0 100%); }
    body.speaking  .ring.r3 { animation-duration: 1s; }

    #status {
      text-align: center;
      font-size: 0.8rem;
      color: var(--blue);
      letter-spacing: 2px;
      min-height: 1.2em;
    }

    /* ============================================================
       5. CHAT AREA
       ============================================================ */
    #chat {
      flex: 1;                      /* takes all remaining space */
      overflow-y: auto;             /* scrolls when messages pile up */
      margin: 8px 0;
      padding: 8px;
      border: 1px solid var(--blue-soft);
      border-radius: 12px;
      background: rgba(3, 12, 24, 0.7);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 85%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--blue-soft);
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--ai-bg);
      border: 1px solid var(--blue);
      box-shadow: 0 0 8px rgba(25, 195, 255, 0.25);
    }

    /* ============================================================
       6. QUICK BUTTONS, INPUT ROW, MIC BUTTON
       ============================================================ */
    #quick {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .quick-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--blue);
      background: rgba(25, 195, 255, 0.08);
      color: var(--blue);
      font-size: 0.9rem;
    }
    .quick-btn:active { background: rgba(25, 195, 255, 0.25); }

    #input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #text-input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 24px;
      border: 1px solid var(--blue-soft);
      background: #06182c;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #text-input:focus { border-color: var(--blue); box-shadow: 0 0 8px var(--blue); }

    .round-btn {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--blue);
      background: rgba(25, 195, 255, 0.12);
      color: var(--blue);
      font-size: 1.3rem;
    }
    #mic-btn.active {
      background: var(--blue);
      color: #02060f;
      box-shadow: 0 0 18px var(--blue);
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- ===== Header: name + language choice ===== -->
    <header>
      <h1>TSD AI</h1>
      <select id="lang-select" aria-label="Language">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="mr-IN">मराठी (Marathi)</option>
      </select>
    </header>
